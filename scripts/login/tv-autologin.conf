# Plasma Login Manager: log straight into Plasma Bigscreen as joakim at power-on (tv-project,
# scripts/install-autologin.sh). Logging out shows the login screen, where the normal desktop can be picked.
# Undo: delete /etc/plasmalogin.conf.d/tv-autologin.conf
[Autologin]
User=joakim
Session=plasma-bigscreen-wayland.desktop
Relogin=false
